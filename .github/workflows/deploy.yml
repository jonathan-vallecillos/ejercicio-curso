name: Build and deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::580446611735:role/GitHubOIDCDeployRole
  CLUSTER_NAME: jonathan-eks-lab
  ECR_REPO: ejercicio-curso-app
  NAMESPACE: demo
  DEPLOYMENT: web
  CONTAINER: web

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          ID_TOKEN=$(python3 -c "import sys, json; print(json.load(sys.stdin)['value'])" <<< "$TOKEN_JSON")
          PAYLOAD=$(python3 -c "import sys, base64; t=sys.argv[1].split('.')[1]; t += '=' * (-len(t) % 4); print(base64.urlsafe_b64decode(t.encode()).decode())" "$ID_TOKEN")
          SUB=$(python3 -c "import sys, json; print(json.load(sys.stdin).get('sub',''))" <<< "$PAYLOAD")
          REPOSITORY=$(python3 -c "import sys, json; print(json.load(sys.stdin).get('repository',''))" <<< "$PAYLOAD")
          REF=$(python3 -c "import sys, json; print(json.load(sys.stdin).get('ref',''))" <<< "$PAYLOAD")
          AUD=$(python3 -c "import sys, json; print(json.load(sys.stdin).get('aud',''))" <<< "$PAYLOAD")
          echo "::notice title=OIDC Claims::sub=$SUB repository=$REPOSITORY ref=$REF aud=$AUD"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}
          role-skip-session-tagging: true
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          docker build \
            --build-arg APP_VERSION=$TAG \
            --build-arg GIT_SHA=$TAG \
            --build-arg BUILD_DATE=$BUILD_DATE \
            -t $REGISTRY/$ECR_REPO:$TAG .
          docker push $REGISTRY/$ECR_REPO:$TAG

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Update deployment image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          kubectl -n $NAMESPACE set image deployment/$DEPLOYMENT \
            $CONTAINER=$REGISTRY/$ECR_REPO:$TAG
          kubectl -n $NAMESPACE annotate deployment/$DEPLOYMENT \
            kubernetes.io/change-cause="commit ${{ github.sha }} by ${{ github.actor }}" \
            --overwrite

      - name: Wait for rollout and rollback if needed
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! kubectl -n $NAMESPACE rollout status deployment/$DEPLOYMENT --timeout=180s; then
            kubectl -n $NAMESPACE rollout undo deployment/$DEPLOYMENT
            kubectl -n $NAMESPACE rollout status deployment/$DEPLOYMENT --timeout=180s || true
            exit 1
          fi
